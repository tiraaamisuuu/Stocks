name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app.py

      - name: Check formatting
        run: ruff format --check src tests app.py

      - name: Test
        run: pytest --cov=paperalpha --cov-report=term-missing --cov-fail-under=70
